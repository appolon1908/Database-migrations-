name: Migration certification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lineage:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
      - name: Compile migration modules
        run: python -m compileall -q middleware scripts
      - name: Verify provenance and migration graph
        run: python scripts/verify_migrations.py
