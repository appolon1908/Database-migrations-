name: leads-mcr-projection

on:
  pull_request:
    paths:
      - 'leads-workstation/**'
      - 'scripts/verify_leads_mcr_projection.py'
      - '.github/workflows/leads-mcr-projection.yml'
  push:
    branches: [main]
    paths:
      - 'leads-workstation/**'
      - 'scripts/verify_leads_mcr_projection.py'

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mcr_verify
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mcr_verify"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify additive MCR-B projection contract
        run: python scripts/verify_leads_mcr_projection.py
      - name: Apply projection schema in disposable PostgreSQL
        run: |
          psql -h 127.0.0.1 -U postgres -d mcr_verify -v ON_ERROR_STOP=1 <<'SQL'
          create role leads_app login password 'ci-only';
          create role leads_readonly login password 'ci-readonly';
          SQL
          psql -h 127.0.0.1 -U postgres -d mcr_verify -v ON_ERROR_STOP=1 -f leads-workstation/0002_mcr_projection_read_model.sql
          test "$(psql -h 127.0.0.1 -U postgres -d mcr_verify -Atc "select count(*) from pg_tables where schemaname='leads' and tablename like 'mcr_%_projection'")" = "5"
          test "$(psql -h 127.0.0.1 -U postgres -d mcr_verify -Atc "select has_schema_privilege('leads_app','leads','USAGE')")" = "t"
          test "$(psql -h 127.0.0.1 -U postgres -d mcr_verify -Atc "select bool_and(has_table_privilege('leads_app','leads.'||tablename,'SELECT')) from pg_tables where schemaname='leads' and tablename like 'mcr_%_projection'")" = "t"
          test "$(psql -h 127.0.0.1 -U postgres -d mcr_verify -Atc "select bool_or(has_table_privilege('leads_app','leads.'||tablename,'INSERT') or has_table_privilege('leads_app','leads.'||tablename,'UPDATE') or has_table_privilege('leads_app','leads.'||tablename,'DELETE')) from pg_tables where schemaname='leads' and tablename like 'mcr_%_projection'")" = "f"
